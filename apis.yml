name: Hesi
description: >-
  Hesi (合思, operated by Beijing Hosi Information Technology Co., Ltd.) is an
  AI-driven spend and expense management SaaS platform founded in 2014 and
  backed by the SoftBank Vision Fund. Its cloud platform covers intelligent
  expense control and reimbursement ("no expense reports needed"), corporate
  business-travel booking, AI-powered audit and approval, electronic accounting
  archives, accounts payable/receivable, and business-intelligence analytics.
  Hesi serves 7,000+ paid enterprises — including large corporations and Fortune
  500 firms across China — and runs a PaaS platform with integrations to roughly
  1,400 banks. The company operates R&D centers in Beijing, Hangzhou, and
  Nanchang with 22 direct service offices nationwide.
